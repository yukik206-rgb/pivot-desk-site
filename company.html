  function fmtMoney(v){
    if (v == null) return "—";
    const abs = Math.abs(v);
    if (abs >= 1e12) return "$" + (v/1e12).toFixed(2) + "T";
    if (abs >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
    if (abs >= 1e6) return "$" + (v/1e6).toFixed(1) + "M";
    return "$" + v.toFixed(0);
  }
  function fmtNum(v, nd){
    if (v == null) return "—";
    return Number(v).toFixed(nd==null?2:nd);
  }
  // NOTE: yfinance quirk verified directly — dividendYield comes back already
  // scaled as a percent number (e.g. 2.4 means 2.4%), while roe/roa/margins/
  // payoutRatio/ownership/growth fields come back as 0-1 fractions needing
  // x100. Mixing these up would silently show numbers 100x too large/small.
  function fmtPctFraction(v){ return v == null ? "—" : (Number(v)*100).toFixed(1) + "%"; }
  function fmtPctAsIs(v){ return v == null ? "—" : Number(v).toFixed(2) + "%"; }
  function fmtInt(v){ return v == null ? "—" : Math.round(v).toLocaleString(); }

  document.getElementById("footDate").textContent = P.meta.date;
  document.getElementById("listSub").textContent = `${P.list.length}銘柄(スクリーニング適合+準合格ウォッチリスト)`;

  const listBody = document.getElementById("listBody");
  function renderList(filter){
    const q = (filter||"").trim().toLowerCase();
    const rows = P.list.filter(r => !q ||
      r.sym.toLowerCase().includes(q) || (r.name||"").toLowerCase().includes(q) || (r.sector||"").toLowerCase().includes(q));
    listBody.innerHTML = rows.map(r => {
      const c = P.companies[r.sym];
      const statePill = r.inMainList
        ? `<span class="pill pill-good">8/8適合</span>`
        : `<span class="pill pill-muted">7/8監視</span>`;
      return `<tr class="row" data-sym="${r.sym}">
        <td class="sym-cell mono">${r.sym}</td>
        <td>${c ? c.name : "—"}</td>
        <td>${c && (c.sectorJa || c.sector) ? (c.sectorJa || c.sector) : "—"}</td>
        <td class="num">${c ? fmtMoney(c.marketCap) : "—"}</td>
        <td class="num">${c && c.trailingPE!=null ? fmtNum(c.trailingPE,1) : "—"}</td>
        <td class="num">${c && c.roe!=null ? fmtPctFraction(c.roe) : "—"}</td>
        <td>${statePill}</td>
      </tr>`;
    }).join("");
  }
  renderList("");

  document.getElementById("searchBox").addEventListener("input", (e) => renderList(e.target.value));

  function renderFinancials(annual){
    if (!annual || !annual.length) return `<div style="color:var(--muted);font-size:0.88rem;">年次財務データを取得できませんでした。</div>`;
    const vals = annual.flatMap(a => [a.revenue, a.netIncome]).filter(v => v != null);
    const maxAbs = Math.max(1, ...vals.map(v => Math.abs(v)));
    const bars = annual.map(a => {
      const revH = a.revenue == null ? 0 : Math.max(2, Math.abs(a.revenue)/maxAbs*130);
      const niH = a.netIncome == null ? 0 : Math.max(2, Math.abs(a.netIncome)/maxAbs*130);
      return `<div class="fin-bar-group">
        <div class="fin-bars">
          <div class="bar rev" style="height:${revH}px" title="売上高 ${fmtMoney(a.revenue)}"></div>
          <div class="bar ni" style="height:${niH}px" title="純利益 ${fmtMoney(a.netIncome)}"></div>
        </div>
        <div class="fin-year mono">${a.year}</div>
      </div>`;
    }).join("");
    return `<div class="fin-chart">${bars}</div>
      <div class="fin-legend">
        <span class="item"><span class="sw" style="background:var(--series-sma50);"></span>売上高</span>
        <span class="item"><span class="sw" style="background:var(--series-sma150);"></span>純利益</span>
      </div>`;
  }

  function selectCompany(sym){
    const c = P.companies[sym];
    const card = document.getElementById("detailCard");
    if (!c){
      card.innerHTML = `<div style="color:var(--muted);">この銘柄の企業情報は取得できませんでした。</div>`;
      return;
    }
    document.querySelectorAll("#listBody tr").forEach(tr => tr.classList.toggle("active", tr.dataset.sym===sym));

    const loc = [c.city, c.country].filter(Boolean).join(", ");
    const q = c.quarterlyGrowth;
    const qLine = q
      ? `売上成長(YoY) ${q.revGrowth==null?"—":fmtPctAsIs(q.revGrowth)} ・ EPS成長(YoY) ${q.epsGrowth==null?"—":fmtPctAsIs(q.epsGrowth)} ・ 評価: ${q.grade}`
      : "四半期成長データなし";

    card.innerHTML = `
      <div class="detail-top">
        <div>
          <span class="detail-name">${c.name}</span><span class="detail-sym mono">${sym}</span>
          <div class="detail-tags">
            ${(c.sectorJa || c.sector) ? `<span class="tag">${c.sectorJa || c.sector}</span>` : ""}

          </div>
        </div>
        <a class="chart-link" href="https://yukik206-rgb.github.io/pivot-desk-site/#${sym}">チャートを見る →</a>
      </div>

      <div class="summary-text">${c.summaryJa || c.summary || "事業内容の説明データがありません。"}</div>
      ${(!c.summaryJa && c.summary) ? `<div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">(日本語訳が未生成のため原文を表示しています)</div>` : ""}
      <div class="meta-line">
        従業員数: ${fmtInt(c.employees)} ・ 本社: ${loc || "—"}
        ${c.website ? ` ・ <a href="${c.website}" target="_blank" rel="noopener">${c.website}</a>` : ""}
      </div>
      <div class="meta-line">${qLine}</div>

      <div class="stat-groups">
        <div class="stat-group">
          <h3>投資指標</h3>
          <div class="stat-list">
            <div class="stat-item"><span class="l">時価総額</span><span class="v num">${fmtMoney(c.marketCap)}</span></div>
            <div class="stat-item"><span class="l">PER(実績)</span><span class="v num">${fmtNum(c.trailingPE,1)}</span></div>
            <div class="stat-item"><span class="l">PER(予想)</span><span class="v num">${fmtNum(c.forwardPE,1)}</span></div>
            <div class="stat-item"><span class="l">PBR</span><span class="v num">${fmtNum(c.priceToBook,2)}</span></div>
            <div class="stat-item"><span class="l">PSR</span><span class="v num">${fmtNum(c.priceToSales,2)}</span></div>
            <div class="stat-item"><span class="l">EV/EBITDA</span><span class="v num">${fmtNum(c.evToEbitda,1)}</span></div>
            <div class="stat-item"><span class="l">配当利回り</span><span class="v num">${fmtPctAsIs(c.dividendYield)}</span></div>
            <div class="stat-item"><span class="l">β(ベータ)</span><span class="v num">${fmtNum(c.beta,2)}</span></div>
          </div>
        </div>
        <div class="stat-group">
          <h3>収益性・財務健全性</h3>
          <div class="stat-list">
            <div class="stat-item"><span class="l">ROE</span><span class="v num">${fmtPctFraction(c.roe)}</span></div>
            <div class="stat-item"><span class="l">ROA</span><span class="v num">${fmtPctFraction(c.roa)}</span></div>
            <div class="stat-item"><span class="l">売上高純利益率</span><span class="v num">${fmtPctFraction(c.profitMargin)}</span></div>
            <div class="stat-item"><span class="l">売上高営業利益率</span><span class="v num">${fmtPctFraction(c.operatingMargin)}</span></div>
            <div class="stat-item"><span class="l">配当性向</span><span class="v num">${fmtPctFraction(c.payoutRatio)}</span></div>
            <div class="stat-item"><span class="l">D/E比率</span><span class="v num">${fmtNum(c.debtToEquity,1)}</span></div>
            <div class="stat-item"><span class="l">流動比率</span><span class="v num">${fmtNum(c.currentRatio,2)}</span></div>
          </div>
        </div>
        <div class="stat-group">
          <h3>需給・52週レンジ</h3>
          <div class="stat-list">
            <div class="stat-item"><span class="l">機関投資家保有比率</span><span class="v num">${fmtPctFraction(c.instOwnPct)}</span></div>
            <div class="stat-item"><span class="l">インサイダー保有比率</span><span class="v num">${fmtPctFraction(c.insiderOwnPct)}</span></div>
            <div class="stat-item"><span class="l">52週高値</span><span class="v num">${c.week52High!=null?"$"+c.week52High.toFixed(2):"—"}</span></div>
            <div class="stat-item"><span class="l">52週安値</span><span class="v num">${c.week52Low!=null?"$"+c.week52Low.toFixed(2):"—"}</span></div>
            <div class="stat-item"><span class="l">平均出来高</span><span class="v num">${fmtInt(c.avgVolume)}</span></div>
            <div class="stat-item"><span class="l">発行済株式数</span><span class="v num">${fmtInt(c.sharesOut)}</span></div>
          </div>
        </div>
      </div>

      <div class="fin-wrap">
        <h3 style="font-size:0.82rem;color:var(--ink-2);font-weight:700;letter-spacing:0.02em;text-transform:uppercase;margin-bottom:10px;">年次業績推移</h3>
        ${renderFinancials(c.annual)}
      </div>
    `;
  }

  listBody.addEventListener("click", (e) => {
    const tr = e.target.closest("tr.row"); if (!tr) return;
    location.hash = tr.dataset.sym;
  });

  function applyHash(){
    const sym = location.hash.replace("#", "").toUpperCase();
    if (sym && P.companies[sym]) selectCompany(sym);
  }
  window.addEventListener("hashchange", applyHash);
  applyHash();
  if (!location.hash && P.list.length) { location.hash = P.list[0].sym; }
})();
</script>
